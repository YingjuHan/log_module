# CAE Logger 配置文件
# 支持的参数与说明：

# 线程模型 (SingleThread/ST 或 MultiThread/MT)
thread_model = MT

# 进程模型 (SingleProcess/SP 或 MultiProcess/MP)
process_model = MP

# IO 模式 (Sync 或 Async)
io_mode = Async

# 是否覆盖同名日志文件 (true/yes/1 或 false/no/0)
truncate_file = false

# 异步队列大小 (建议 2 的幂)
async_queue_size = 4096

# 异步后台线程数
async_thread_count = 1

# Async overflow policy (block or overrun_oldest)
async_overflow_policy = block

# Optional lossy load-shedding policy.
# Disabled by default; when enabled, records below lossy_drop_below_level are counted and dropped before sinks.
enable_lossy_drop_policy = false
lossy_drop_below_level = trace

# Stable job id for CAE event schema v1; empty means use session id
job_id =

# JSONL analysis log resilience controls
# 0 disables size-based rotation; positive values rotate after the current segment exceeds the byte limit.
analysis_log_max_bytes = 134217728
analysis_log_retention_files = 0

# Emit a v1 Logger/Runtime health snapshot every N application events; 0 disables snapshots.
logger_health_interval_events = 1000

# 日志全局格式
global_pattern = "[%Y-%m-%d %H:%M:%S.%e] [%t] [%n] [%^%l%$] [E2E] %v"

# 调用链输出
# - 默认开启
# - 添加到控制台/文本日志（结构化写入到 JSONL）
# - 默认仅在 error 及以上级别采集；如需在 warn/info 输出，可下调下面的阈值
enable_call_chain_analysis = true
call_chain_min_level = error
call_chain_max_depth = 16
call_chain_skip = 0
call_chain_sample_rate = 1.0
